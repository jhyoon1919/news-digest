<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스 다이제스트 아카이브</title>
<style>
  :root {
    --canvas: #000000;
    --on-dark: #ffffff;
    --body: #bbbbbb;
    --body-strong: #e6e6e6;
    --muted: #7e7e7e;
    --hairline: #3c3c3c;
    --m-blue-light: #0066b1;
    --m-blue-dark: #1c69d4;
    --m-red: #e22718;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--on-dark);
    font-family: "BMWTypeNextLatin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-weight: 300;
    line-height: 1.6;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 40px 24px 64px; }
  header.title-block { padding-bottom: 24px; margin-bottom: 24px; }
  .m-stripe {
    height: 4px;
    width: 96px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, var(--m-blue-light), var(--m-blue-dark), var(--m-red));
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 10px; color: var(--on-dark); }
  .meta { color: var(--body); font-size: 13px; font-weight: 300; }
  ul.archive-list { list-style: none; margin: 24px 0 0; padding: 0; }
  ul.archive-list li { border-bottom: 1px solid var(--hairline); }
  ul.archive-list a {
    display: block;
    padding: 16px 4px;
    color: var(--body-strong);
    text-decoration: none;
    font-size: 15px;
  }
  ul.archive-list a:hover { color: var(--on-dark); }
</style>
</head>
<body>
<div class="page">
  <header class="title-block">
    <div class="m-stripe"></div>
    <h1>뉴스 다이제스트 아카이브</h1>
    <div class="meta">전날 주요 국내외 뉴스 다이제스트 목록</div>
  </header>

  <ul class="archive-list">
    <li><a href="digests/2026-08-11.html">2026-08-11 다이제스트</a></li>
  </ul>
</div>
</body>
</html>
