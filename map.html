<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외 딜 지도 · M&A 딜 다이제스트</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --canvas: #000000;
    --on-dark: #ffffff;
    --body: #bbbbbb;
    --body-strong: #e6e6e6;
    --muted: #7e7e7e;
    --hairline: #3c3c3c;
    --m-blue-light: #0066b1;
    --m-blue-dark: #1c69d4;
    --m-red: #e22718;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--on-dark);
    font-family: "BMWTypeNextLatin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-weight: 300;
    line-height: 1.6;
  }
  .page { max-width: 960px; margin: 0 auto; padding: 40px 24px 64px; }
  header.title-block { padding-bottom: 24px; margin-bottom: 24px; }
  .m-stripe {
    height: 4px;
    width: 96px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, var(--m-blue-light), var(--m-blue-dark), var(--m-red));
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 10px; color: var(--on-dark); }
  .meta { color: var(--body); font-size: 13px; }
  .top-nav { margin-bottom: 24px; font-size: 12px; }
  .top-nav a { color: var(--body-strong); text-decoration: underline; margin-right: 16px; }

  #map {
    height: 480px;
    border: 1px solid var(--hairline);
    background: #111;
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: #1a1a1a;
    color: var(--body-strong);
  }
  .popup-title { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; color: var(--on-dark); }
  .popup-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .popup-link { color: var(--m-blue-light); font-size: 12px; font-weight: 700; text-decoration: none; }

  .empty-state { color: var(--body); font-size: 13.5px; text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<div class="page">

  <header class="title-block">
    <div class="m-stripe"></div>
    <h1>해외 딜 지도</h1>
    <div class="meta">해외 당사자가 있는 M&A 딜의 소재지를 지도에 표시합니다.</div>
  </header>

  <nav class="top-nav">
    <a href="index.html">← 딜 다이제스트</a>
    <a href="search.html">딜 검색</a>
    <a href="dashboard.html">트렌드 대시보드</a>
    <a href="chat.html">뉴스 Q&A</a>
  </nav>

  <div id="map"></div>
  <p class="empty-state" id="empty-state" hidden>위치 정보가 있는 해외 딜이 없습니다.</p>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://zxihwjolqjdfbyedachb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4aWh3am9scWpkZmJ5ZWRhY2hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODI4NjgsImV4cCI6MjEwMjA1ODg2OH0.B9sXpBT0gR03bRhi96zOjXYIlr1tA_Lhk5J8J-7pHIc';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadLocatedDeals() {
    const { data, error } = await sb
      .from('news_digest_articles')
      .select('*')
      .eq('region', '해외')
      .not('lat', 'is', null)
      .not('lng', 'is', null)
      .order('published_at', { ascending: false })
      .limit(200);

    if (error) {
      console.warn('지도 데이터 조회 실패', error);
      return [];
    }
    return data || [];
  }

  function formatValue(deal) {
    if (deal.deal_value_krw_100m == null) return '거래금액 비공개';
    return `${Number(deal.deal_value_krw_100m).toLocaleString('ko-KR', { maximumFractionDigits: 0 })}억원`;
  }

  function init() {
    const map = L.map('map', { worldCopyJump: true }).setView([20, 20], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18,
    }).addTo(map);

    loadLocatedDeals().then(deals => {
      if (deals.length === 0) {
        document.getElementById('empty-state').hidden = false;
        return;
      }

      const bounds = [];
      deals.forEach(d => {
        const marker = L.circleMarker([d.lat, d.lng], {
          radius: 8,
          color: '#e66767',
          weight: 2,
          fillColor: '#e34948',
          fillOpacity: 0.7,
        }).addTo(map);

        const popup = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'popup-title';
        title.textContent = `${d.acquirer || '?'} → ${d.target || '?'}`;
        const value = document.createElement('div');
        value.className = 'popup-meta';
        value.textContent = formatValue(d);
        const meta = document.createElement('div');
        meta.className = 'popup-meta';
        meta.textContent = `${d.country || ''} · ${d.outlet} · ${d.published_at}`;
        const link = document.createElement('a');
        link.className = 'popup-link';
        link.href = d.source_url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = '원문보기 →';

        popup.appendChild(title);
        popup.appendChild(value);
        popup.appendChild(meta);
        popup.appendChild(link);

        marker.bindPopup(popup);
        bounds.push([d.lat, d.lng]);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 6 });
      }
    });
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
