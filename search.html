<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>딜 검색 · M&A 딜 다이제스트</title>
<style>
  :root {
    --canvas: #000000;
    --on-dark: #ffffff;
    --body: #bbbbbb;
    --body-strong: #e6e6e6;
    --muted: #7e7e7e;
    --hairline: #3c3c3c;
    --surface-card: #1a1a1a;
    --m-blue-light: #0066b1;
    --m-blue-dark: #1c69d4;
    --m-red: #e22718;
    --mark-bg: #1c69d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--on-dark);
    font-family: "BMWTypeNextLatin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-weight: 300;
    line-height: 1.6;
    overflow-wrap: break-word;
  }
  .page { max-width: 900px; margin: 0 auto; padding: 40px 24px 64px; }
  header.title-block { padding-bottom: 24px; margin-bottom: 24px; }
  .m-stripe {
    height: 4px;
    width: 96px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, var(--m-blue-light), var(--m-blue-dark), var(--m-red));
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 10px; color: var(--on-dark); }
  h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; color: var(--body-strong); }
  .meta { color: var(--body); font-size: 13px; }
  .top-nav { margin-bottom: 24px; font-size: 12px; }
  .top-nav a { color: var(--body-strong); text-decoration: underline; margin-right: 16px; }

  .panel { border: 1px solid var(--hairline); padding: 20px; margin-bottom: 24px; }

  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type="text"], input[type="date"] {
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    color: var(--on-dark);
    padding: 8px 10px;
    font-size: 13.5px;
    font-family: inherit;
    border-radius: 0;
  }
  .search-row input[type="text"] { flex: 1; }
  button {
    background: var(--on-dark);
    color: #000;
    border: none;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
  }
  button.ghost { background: transparent; color: var(--body); border: 1px solid var(--hairline); }

  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--body);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .chip.active { color: var(--on-dark); border-color: var(--on-dark); }

  .date-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--body); }

  .keyword-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .keyword-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--hairline);
    padding: 4px 6px 4px 12px;
    font-size: 12.5px;
    color: var(--body-strong);
  }
  .keyword-chip button { background: transparent; color: var(--muted); border: none; padding: 2px 8px; font-size: 11px; }

  .cards { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .card { border: 1px solid var(--hairline); padding: 20px; }
  .tags { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .deal-title { margin: 0 0 8px; font-size: 17px; font-weight: 700; color: var(--on-dark); }
  .deal-title .arrow { color: var(--m-blue-light); margin: 0 6px; }
  .deal-value { font-size: 13px; color: var(--body-strong); margin-bottom: 10px; font-weight: 700; }
  .deal-value .note { color: var(--muted); font-weight: 300; margin-left: 6px; }
  p.summary { margin: 0 0 14px; font-size: 14px; white-space: pre-line; color: var(--body-strong); }
  .advisors { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .card-footer {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    font-size: 12px; color: var(--muted); border-top: 1px solid var(--hairline); padding-top: 10px;
  }
  .card-footer a { color: var(--on-dark); text-decoration: none; font-weight: 700; }
  mark { background: var(--mark-bg); color: var(--on-dark); padding: 0 2px; }

  .empty-state { color: var(--body); font-size: 13.5px; text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<div class="page">

  <header class="title-block">
    <div class="m-stripe"></div>
    <h1>딜 검색</h1>
    <div class="meta">저장된 M&A 딜을 회사명·섹터·지역·딜유형·기간으로 검색합니다.</div>
  </header>

  <nav class="top-nav">
    <a href="index.html">← 딜 다이제스트</a>
    <a href="dashboard.html">트렌드 대시보드</a>
    <a href="map.html">해외 딜 지도</a>
    <a href="chat.html">뉴스 Q&A</a>
  </nav>

  <section class="panel">
    <div class="search-row">
      <input type="text" id="q" placeholder="회사명·키워드 검색 (예: 삼성, 반도체)">
      <button id="btn-search">검색</button>
    </div>

    <div class="filter-row" id="region-filters">
      <button class="chip active" data-region="all">전체 지역</button>
      <button class="chip" data-region="국내">국내</button>
      <button class="chip" data-region="해외">해외</button>
    </div>
    <div class="filter-row" id="sector-filters"><button class="chip active" data-sector="all">전체 섹터</button></div>
    <div class="filter-row" id="type-filters"><button class="chip active" data-type="all">전체 딜유형</button></div>
    <div class="date-row">
      <span>발표일</span>
      <input type="date" id="date-from">
      <span>~</span>
      <input type="date" id="date-to">
      <button class="ghost" id="btn-reset">초기화</button>
    </div>
  </section>

  <section class="panel">
    <h2>관심 기업</h2>
    <div class="search-row">
      <input type="text" id="keyword-input" placeholder="관심 기업 추가 (예: 삼성전자)">
      <button id="btn-add-keyword">추가</button>
    </div>
    <div class="keyword-list" id="keyword-list"></div>
  </section>

  <section>
    <div class="cards" id="results"></div>
    <p class="empty-state" id="empty-state" hidden>검색 결과가 없습니다.</p>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://zxihwjolqjdfbyedachb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4aWh3am9scWpkZmJ5ZWRhY2hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODI4NjgsImV4cCI6MjEwMjA1ODg2OH0.B9sXpBT0gR03bRhi96zOjXYIlr1tA_Lhk5J8J-7pHIc';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let region = 'all';
  let sector = 'all';
  let dealType = 'all';

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeRegExp(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function highlight(text, keyword) {
    const escaped = escapeHtml(text);
    if (!keyword) return escaped;
    const re = new RegExp(escapeRegExp(escapeHtml(keyword)), 'gi');
    return escaped.replace(re, m => `<mark>${m}</mark>`);
  }
  function formatValue(deal) {
    if (deal.deal_value_krw_100m == null) return '거래금액 비공개';
    return `${Number(deal.deal_value_krw_100m).toLocaleString('ko-KR', { maximumFractionDigits: 0 })}억원`;
  }

  async function loadKeywords() {
    const { data, error } = await sb.from('watched_keywords').select('*').order('created_at', { ascending: true });
    if (error) { console.warn('관심 기업 조회 실패', error); return []; }
    return data;
  }

  async function renderKeywords() {
    const list = document.getElementById('keyword-list');
    const keywords = await loadKeywords();
    list.innerHTML = '';
    keywords.forEach(k => {
      const chip = document.createElement('div');
      chip.className = 'keyword-chip';
      chip.innerHTML = `<span>${escapeHtml(k.keyword)}</span>`;
      const useBtn = document.createElement('button');
      useBtn.textContent = '검색';
      useBtn.addEventListener('click', () => { document.getElementById('q').value = k.keyword; runSearch(); });
      const delBtn = document.createElement('button');
      delBtn.textContent = '삭제';
      delBtn.addEventListener('click', async () => { await sb.from('watched_keywords').delete().eq('id', k.id); renderKeywords(); });
      chip.appendChild(useBtn);
      chip.appendChild(delBtn);
      list.appendChild(chip);
    });
  }

  function buildDynamicFilters(rows) {
    const sectorContainer = document.getElementById('sector-filters');
    const typeContainer = document.getElementById('type-filters');
    const sectors = [...new Set(rows.map(r => r.category).filter(Boolean))];
    const types = [...new Set(rows.map(r => r.deal_type).filter(Boolean))];

    sectorContainer.innerHTML = '<button class="chip active" data-sector="all">전체 섹터</button>';
    sectors.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'chip'; btn.dataset.sector = s; btn.textContent = s;
      sectorContainer.appendChild(btn);
    });
    typeContainer.innerHTML = '<button class="chip active" data-type="all">전체 딜유형</button>';
    types.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'chip'; btn.dataset.type = t; btn.textContent = t;
      typeContainer.appendChild(btn);
    });
  }

  function renderResults(items, keyword) {
    const results = document.getElementById('results');
    const emptyState = document.getElementById('empty-state');
    results.innerHTML = '';
    emptyState.hidden = items.length !== 0;

    items.forEach(d => {
      const advisorsText = (d.advisors && d.advisors.length) ? `자문사: ${d.advisors.join(', ')}` : '';
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="tags">
          <span class="badge">${escapeHtml(d.region)}</span>
          <span class="badge">${escapeHtml(d.category)}</span>
          <span class="badge">${escapeHtml(d.deal_type)}</span>
        </div>
        <h3 class="deal-title">${highlight(d.acquirer, keyword)}<span class="arrow">→</span>${highlight(d.target, keyword)}</h3>
        <div class="deal-value">${formatValue(d)}${d.deal_value_note ? `<span class="note">(${escapeHtml(d.deal_value_note)})</span>` : ''}</div>
        <p class="summary">${highlight(d.summary, keyword)}</p>
        ${advisorsText ? `<div class="advisors">${escapeHtml(advisorsText)}</div>` : ''}
        <div class="card-footer">
          <span>${escapeHtml(d.outlet)} · ${d.published_at}</span>
          <a href="${d.source_url}" target="_blank" rel="noopener">원문보기 →</a>
        </div>
      `;
      results.appendChild(card);
    });
  }

  async function runSearch() {
    const keyword = document.getElementById('q').value.trim();
    const dateFrom = document.getElementById('date-from').value;
    const dateTo = document.getElementById('date-to').value;

    let query = sb.from('news_digest_articles').select('*');

    if (keyword) {
      const like = `%${keyword}%`;
      query = query.or(`title.ilike.${like},summary.ilike.${like},acquirer.ilike.${like},target.ilike.${like}`);
    }
    if (region !== 'all') query = query.eq('region', region);
    if (sector !== 'all') query = query.eq('category', sector);
    if (dealType !== 'all') query = query.eq('deal_type', dealType);
    if (dateFrom) query = query.gte('published_at', dateFrom);
    if (dateTo) query = query.lte('published_at', dateTo);

    query = query.order('published_at', { ascending: false }).limit(200);

    const { data, error } = await query;
    if (error) { console.warn('검색 실패', error); renderResults([], keyword); return; }
    renderResults(data || [], keyword);
    if (!window.__filtersBuilt) { buildDynamicFilters(data || []); window.__filtersBuilt = true; }
  }

  function init() {
    document.getElementById('btn-search').addEventListener('click', runSearch);
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
    document.getElementById('date-from').addEventListener('change', runSearch);
    document.getElementById('date-to').addEventListener('change', runSearch);

    document.getElementById('region-filters').addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      document.querySelectorAll('#region-filters .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active'); region = btn.dataset.region; runSearch();
    });
    document.getElementById('sector-filters').addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      document.querySelectorAll('#sector-filters .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active'); sector = btn.dataset.sector; runSearch();
    });
    document.getElementById('type-filters').addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      document.querySelectorAll('#type-filters .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active'); dealType = btn.dataset.type; runSearch();
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      document.getElementById('q').value = '';
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      region = 'all'; sector = 'all'; dealType = 'all';
      document.querySelectorAll('#region-filters .chip').forEach(c => c.classList.remove('active'));
      document.querySelector('#region-filters .chip[data-region="all"]').classList.add('active');
      document.querySelectorAll('#sector-filters .chip').forEach(c => c.classList.remove('active'));
      document.querySelector('#sector-filters .chip[data-sector="all"]').classList.add('active');
      document.querySelectorAll('#type-filters .chip').forEach(c => c.classList.remove('active'));
      document.querySelector('#type-filters .chip[data-type="all"]').classList.add('active');
      runSearch();
    });

    document.getElementById('btn-add-keyword').addEventListener('click', async () => {
      const input = document.getElementById('keyword-input');
      const keyword = input.value.trim();
      if (!keyword) return;
      const { error } = await sb.from('watched_keywords').upsert({ keyword }, { onConflict: 'keyword', ignoreDuplicates: true });
      if (error) { alert('관심 기업 추가 실패: ' + error.message); return; }
      input.value = '';
      renderKeywords();
    });

    renderKeywords();
    runSearch();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
