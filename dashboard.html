<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트렌드 대시보드 · 뉴스 다이제스트</title>
<style>
  :root {
    --canvas: #000000;
    --on-dark: #ffffff;
    --body: #bbbbbb;
    --body-strong: #e6e6e6;
    --muted: #7e7e7e;
    --hairline: #3c3c3c;
    --surface-card: #1a1a1a;
    --m-blue-light: #0066b1;
    --m-blue-dark: #1c69d4;
    --m-red: #e22718;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--on-dark);
    font-family: "BMWTypeNextLatin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-weight: 300;
    line-height: 1.6;
  }
  .page { max-width: 900px; margin: 0 auto; padding: 40px 24px 64px; }
  header.title-block { padding-bottom: 24px; margin-bottom: 24px; }
  .m-stripe {
    height: 4px;
    width: 96px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, var(--m-blue-light), var(--m-blue-dark), var(--m-red));
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 10px; color: var(--on-dark); }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 16px; color: var(--body-strong); }
  .meta { color: var(--body); font-size: 13px; }
  .top-nav { margin-bottom: 24px; font-size: 12px; }
  .top-nav a { color: var(--body-strong); text-decoration: underline; margin-right: 16px; }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  .preset {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--body);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
  }
  .preset.active { color: var(--on-dark); border-color: var(--on-dark); }

  .chart-card {
    border: 1px solid var(--hairline);
    padding: 20px;
    margin-bottom: 28px;
  }
  .chart-wrap { position: relative; height: 280px; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.data-table th, table.data-table td {
    border-bottom: 1px solid var(--hairline);
    padding: 8px 6px;
    text-align: left;
    color: var(--body-strong);
  }
  table.data-table th { color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }

  details { margin-bottom: 28px; }
  summary { cursor: pointer; color: var(--body); font-size: 13px; margin-bottom: 12px; }

  .empty-state { color: var(--body); font-size: 13.5px; text-align: center; padding: 32px 0; }

  .hot-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .hot-badge {
    border: 1px solid var(--m-red);
    color: var(--body-strong);
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="page">

  <header class="title-block">
    <div class="m-stripe"></div>
    <h1>트렌드 대시보드</h1>
    <div class="meta">일자별 카테고리·지역 기사 건수 추이입니다.</div>
  </header>

  <nav class="top-nav">
    <a href="index.html">← 아카이브로</a>
    <a href="search.html">뉴스 검색</a>
    <a href="map.html">해외 뉴스 지도</a>
    <a href="chat.html">뉴스 Q&A</a>
  </nav>

  <div class="filter-row" id="range-filters">
    <button class="preset" data-days="7">최근 7일</button>
    <button class="preset active" data-days="30">최근 30일</button>
    <button class="preset" data-days="90">최근 90일</button>
    <button class="preset" data-days="0">전체</button>
  </div>

  <p class="empty-state" id="empty-state" hidden>표시할 데이터가 없습니다.</p>

  <div id="chart-area" hidden>
    <div class="chart-card">
      <h2>카테고리별 기사 건수 추이</h2>
      <div class="hot-badges" id="hot-badges"></div>
      <div class="chart-wrap"><canvas id="category-chart"></canvas></div>
    </div>

    <div class="chart-card">
      <h2>지역별 기사 건수 추이</h2>
      <div class="chart-wrap"><canvas id="region-chart"></canvas></div>
    </div>

    <details>
      <summary>표로 보기 (일자·지역·카테고리·건수)</summary>
      <table class="data-table" id="data-table">
        <thead>
          <tr><th>날짜</th><th>지역</th><th>카테고리</th><th>건수</th></tr>
        </thead>
        <tbody id="data-table-body"></tbody>
      </table>
    </details>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
  const SUPABASE_URL = 'https://zxihwjolqjdfbyedachb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4aWh3am9scWpkZmJ5ZWRhY2hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODI4NjgsImV4cCI6MjEwMjA1ODg2OH0.B9sXpBT0gR03bRhi96zOjXYIlr1tA_Lhk5J8J-7pHIc';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Validated dark-mode categorical slots (node scripts/validate_palette.js, surface #000000): all PASS
  const CATEGORY_COLORS = {
    '정치': '#3987e5', // slot 1 blue
    '경제': '#d95926', // slot 2 orange
    '사회': '#199e70', // slot 3 aqua
    '국제': '#c98500', // slot 4 yellow
  };
  const REGION_COLORS = {
    '국내': '#3987e5', // slot 1 blue
    '해외': '#e66767', // slot 8 red (dark)
  };
  const AXIS_INK = '#7e7e7e';
  const GRID_INK = '#2c2c2a';
  const LEGEND_INK = '#e6e6e6';

  let categoryChart = null;
  let regionChart = null;

  function toISODate(d) {
    return d.toISOString().slice(0, 10);
  }

  async function loadRows(days) {
    let query = sb.from('news_digest_articles').select('digest_date, region, category');
    if (days > 0) {
      const from = new Date();
      from.setDate(from.getDate() - days);
      query = query.gte('digest_date', toISODate(from));
    }
    const { data, error } = await query.order('digest_date', { ascending: true });
    if (error) {
      console.warn('대시보드 데이터 조회 실패', error);
      return [];
    }
    return data || [];
  }

  function buildSeries(rows, dimension, colorMap) {
    const dates = [...new Set(rows.map(r => r.digest_date))].sort();
    const keys = Object.keys(colorMap);
    const counts = {};
    keys.forEach(k => { counts[k] = {}; });

    rows.forEach(r => {
      const key = r[dimension];
      if (!counts[key]) return;
      counts[key][r.digest_date] = (counts[key][r.digest_date] || 0) + 1;
    });

    const datasets = keys.map(k => ({
      label: k,
      data: dates.map(d => counts[k][d] || 0),
      backgroundColor: colorMap[k],
      borderWidth: 0,
      borderRadius: 4,
      borderSkipped: false,
      maxBarThickness: 24,
    }));

    return { dates, datasets };
  }

  function renderChart(canvasId, existingChart, dates, datasets, title) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    if (existingChart) existingChart.destroy();

    return new Chart(ctx, {
      type: 'bar',
      data: { labels: dates, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            position: 'top',
            align: 'start',
            labels: { color: LEGEND_INK, boxWidth: 12, boxHeight: 12, font: { size: 12 } },
          },
          tooltip: {
            backgroundColor: '#1a1a1a',
            titleColor: LEGEND_INK,
            bodyColor: LEGEND_INK,
            borderColor: '#3c3c3c',
            borderWidth: 1,
            callbacks: {
              label: (item) => `${item.dataset.label}: ${item.formattedValue}건`,
            },
          },
        },
        scales: {
          x: {
            stacked: true,
            ticks: { color: AXIS_INK, font: { size: 11 } },
            grid: { color: GRID_INK },
          },
          y: {
            stacked: true,
            beginAtZero: true,
            ticks: { color: AXIS_INK, font: { size: 11 }, precision: 0 },
            grid: { color: GRID_INK },
          },
        },
      },
    });
  }

  function detectOutliers(series) {
    const { dates, datasets } = series;
    if (dates.length < 2) return [];

    const outliers = [];
    datasets.forEach(ds => {
      const priorValues = ds.data.slice(0, -1);
      const latestValue = ds.data[ds.data.length - 1];
      const priorSum = priorValues.reduce((a, b) => a + b, 0);
      const avg = priorValues.length > 0 ? priorSum / priorValues.length : 0;

      if (latestValue < 2) return;
      if (avg > 0 && latestValue >= avg * 1.5) {
        outliers.push({ label: ds.label, latestValue, avg });
      } else if (avg === 0) {
        outliers.push({ label: ds.label, latestValue, avg });
      }
    });
    return outliers;
  }

  function renderHotBadges(outliers) {
    const container = document.getElementById('hot-badges');
    container.innerHTML = '';
    outliers.forEach(o => {
      const badge = document.createElement('span');
      badge.className = 'hot-badge';
      badge.textContent = `🔥 오늘 화제: ${o.label} ${o.latestValue}건 (평소 평균 ${o.avg.toFixed(1)}건)`;
      container.appendChild(badge);
    });
  }

  function renderTable(rows) {
    const counts = new Map();
    rows.forEach(r => {
      const key = `${r.digest_date}|${r.region}|${r.category}`;
      counts.set(key, (counts.get(key) || 0) + 1);
    });

    const tbody = document.getElementById('data-table-body');
    tbody.innerHTML = '';

    [...counts.entries()]
      .sort((a, b) => (a[0] < b[0] ? 1 : -1))
      .forEach(([key, count]) => {
        const [date, region, category] = key.split('|');
        const tr = document.createElement('tr');
        [date, region, category, String(count)].forEach(text => {
          const td = document.createElement('td');
          td.textContent = text;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
  }

  async function renderAll(days) {
    const rows = await loadRows(days);
    const emptyState = document.getElementById('empty-state');
    const chartArea = document.getElementById('chart-area');

    if (rows.length === 0) {
      emptyState.hidden = false;
      chartArea.hidden = true;
      return;
    }
    emptyState.hidden = true;
    chartArea.hidden = false;

    const categorySeries = buildSeries(rows, 'category', CATEGORY_COLORS);
    const regionSeries = buildSeries(rows, 'region', REGION_COLORS);

    categoryChart = renderChart('category-chart', categoryChart, categorySeries.dates, categorySeries.datasets);
    regionChart = renderChart('region-chart', regionChart, regionSeries.dates, regionSeries.datasets);
    renderHotBadges(detectOutliers(categorySeries));
    renderTable(rows);
  }

  function init() {
    document.getElementById('range-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.preset');
      if (!btn) return;
      document.querySelectorAll('#range-filters .preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll(Number(btn.dataset.days));
    });

    renderAll(30);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
